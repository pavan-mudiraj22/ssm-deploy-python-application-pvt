
name: Deploy Python Application using AWS SSM

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Private EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Python Application using SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -e

          echo "Starting deployment..."

          PARAMS=$(jq -n '{
            commands: [
              "set -e",
              "apt-get update",
              "apt-get install -y git python3 python3-venv python3-pip",
              "mkdir -p /opt/python-app",
              "if [ ! -d /opt/python-app/.git ]; then git clone https://github.com/pavan-mudiraj22/ssm-deploy-python-application-pvt.git /opt/python-app; fi",
              "cd /opt/python-app",
              "git fetch origin main",
              "git reset --hard origin/main",
              "python3 -m venv venv",
              "./venv/bin/pip install -r requirements.txt",
              "cat > /etc/systemd/system/python-app.service <<'EOF'\n[Unit]\nDescription=Python Flask Application\nAfter=network.target\n\n[Service]\nWorkingDirectory=/opt/python-app\nExecStart=/opt/python-app/venv/bin/python app.py\nRestart=always\nUser=root\n\n[Install]\nWantedBy=multi-user.target\nEOF",
              "systemctl daemon-reload",
              "systemctl enable python-app",
              "systemctl restart python-app",
              "systemctl is-active python-app",
              "curl -f http://localhost:8000"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Python application using SSM" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"; then

            echo "Deployment successful!"

          else

            echo "Deployment failed!"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardOutputContent" \
              --output text || true

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text || true

            exit 1
          fi

          echo "Application deployment completed!"
