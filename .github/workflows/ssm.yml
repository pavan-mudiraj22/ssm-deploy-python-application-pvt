name: Deploy Python Application using AWS SSM

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Private EC2
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Step 3: Deploy application through SSM
      - name: Deploy Python Application using SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -e

          echo "Starting deployment..."

          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "ERROR: EC2_INSTANCE_ID is missing"
            exit 1
          fi

          PARAMS=$(jq -n '{
            commands: [
              "set -e",
              "echo Starting deployment on EC2",
              "apt-get update",
              "apt-get install -y git python3 python3-venv python3-pip curl",
              "mkdir -p /opt/python-app",
              "if [ ! -d /opt/python-app/.git ]; then git clone https://github.com/pavan-mudiraj22/ssm-deploy-python-application-pvt.git /opt/python-app; fi",
              "cd /opt/python-app",
              "git fetch origin main",
              "git reset --hard origin/main",
              "echo Checking application files",
              "ls -la",
              "python3 -m venv venv",
              "./venv/bin/pip install --upgrade pip",
              "./venv/bin/pip install -r requirements.txt",
              "echo Creating systemd service",
              "cat > /etc/systemd/system/python-app.service <<'EOF'\n[Unit]\nDescription=Python Flask Application\nAfter=network.target\n\n[Service]\nWorkingDirectory=/opt/python-app\nExecStart=/opt/python-app/venv/bin/python -u /opt/python-app/app.py\nRestart=always\nRestartSec=5\nUser=root\n\n[Install]\nWantedBy=multi-user.target\nEOF",
              "systemctl daemon-reload",
              "systemctl enable python-app",
              "systemctl restart python-app",
              "sleep 5",
              "echo Checking service status",
              "systemctl status python-app --no-pager || true",
              "echo Checking application logs",
              "journalctl -u python-app -n 50 --no-pager || true",
              "echo Testing Flask application",
              "curl -v http://127.0.0.1:8000"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Python application using GitHub Actions" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment..."

          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"; then

            echo "Deployment successful!"

          else

            echo "Deployment failed!"

            echo "========== STANDARD OUTPUT =========="

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardOutputContent" \
              --output text || true

            echo "========== STANDARD ERROR =========="

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text || true

            exit 1
          fi

          echo "========== FINAL OUTPUT =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          echo "Python application deployed successfully!"
