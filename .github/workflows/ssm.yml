
name: Deploy Python Application using AWS SSM

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Private EC2
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Step 3: Verify EC2 instance
      - name: Verify EC2 Instance
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -e

          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "ERROR: EC2 instance ID is missing"
            exit 1
          fi

          echo "EC2 instance ID configured"

      # Step 4: Deploy application through SSM
      - name: Deploy Python Application using SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -e

          echo "Starting deployment..."

          PARAMS=$(jq -n '{
            commands: [
              "set -e",
              "echo Starting EC2 deployment",
              "apt-get update",
              "apt-get install -y git python3 python3-venv python3-pip",
              "mkdir -p /opt/python-app",
              "if [ ! -d /opt/python-app/.git ]; then git clone https://github.com/pavan-mudiraj22/ssm-deploy-python-application-pvt.git /opt/python-app; fi",
              "cd /opt/python-app",
              "git fetch origin main",
              "git reset --hard origin/main",
              "python3 -m venv venv",
              "./venv/bin/pip install -r requirements.txt",
              "systemctl restart python-app",
              "systemctl is-active python-app"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Python application" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for SSM execution..."

          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"; then

            echo "Deployment succeeded!"

          else

            echo "Deployment failed!"
            echo "Fetching SSM error details..."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text || true

            echo "========== STANDARD OUTPUT =========="

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardOutputContent" \
              --output text || true

            echo "========== STANDARD ERROR =========="

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text || true

            exit 1

          fi

          echo "========== DEPLOYMENT OUTPUT =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
